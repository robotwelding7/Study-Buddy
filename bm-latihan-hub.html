<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bahasa Melayu — Latihan</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#EEF3F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFDFF;
    --ink:#1E2A4A;
    --ink-soft:#5A6785;
    --grid:#DCE8F7;
    --bm:#5B5F97;
    --bm-soft:#EBEBF5;
    --ready:#2F7A4F;
    --ready-bg:#EAF7EF;
    --soon-bg:#F1F2F5;
    --soon-ink:#9099AA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:18px 16px 40px;
  }
  .back-btn{
    background:none;border:none;font-family:'Fredoka';font-size:14px;font-weight:600;
    color:var(--ink-soft);padding:6px 0 14px;cursor:pointer;
  }
  header{margin-bottom:18px;}
  .eyebrow{
    font-family:'Fredoka';font-size:12px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:var(--bm);
  }
  h1{
    font-family:'Fredoka';font-weight:700;font-size:clamp(26px,7vw,34px);
    margin:4px 0 4px;color:var(--ink);
  }
  .sub{font-size:14px;color:var(--ink-soft);max-width:48ch;}

  /* ---- Darjah picker grid ---- */
  .darjah-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;
  }
  .darjah-card{
    background:#fff;border:2.5px solid var(--bm);border-radius:14px;
    padding:16px 14px;text-align:center;cursor:pointer;
    box-shadow:0 4px 0 var(--bm);
    transition:transform .1s;
  }
  .darjah-card:active{transform:translateY(2px);box-shadow:0 2px 0 var(--bm);}
  .darjah-num{font-family:'Fredoka';font-weight:700;font-size:28px;color:var(--bm);}
  .darjah-name{font-family:'Fredoka';font-weight:600;font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .darjah-count{font-size:11px;color:var(--ink-soft);margin-top:6px;font-weight:700;}

  /* ---- Topic list (within a darjah) ---- */
  .topic-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .topic-card{
    display:flex;align-items:center;gap:12px;
    background:#fff;border-radius:12px;padding:14px 16px;
    text-decoration:none;color:inherit;
    box-shadow:0 1px 0 rgba(0,0,0,0.04),0 4px 12px rgba(30,42,74,0.06);
  }
  .topic-card.ready{border-left:5px solid var(--ready);}
  .topic-card.soon{border-left:5px solid #D8DCE3;opacity:0.72;}
  .topic-icon{font-size:24px;flex:0 0 auto;width:34px;text-align:center;}
  .topic-body{flex:1;min-width:0;}
  .topic-name{font-family:'Fredoka';font-weight:600;font-size:15px;color:var(--ink);}
  .topic-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
  .topic-badge{
    flex:0 0 auto;font-family:'Fredoka';font-size:10.5px;font-weight:600;
    padding:4px 10px;border-radius:20px;white-space:nowrap;
  }
  .badge-ready{background:var(--ready-bg);color:var(--ready);}
  .badge-soon{background:var(--soon-bg);color:var(--soon-ink);}
  .topic-card.soon .topic-name,.topic-card.soon .topic-desc{color:var(--soon-ink);}

  footer{text-align:center;margin-top:32px;font-size:11px;color:var(--ink-soft);font-family:'Fredoka';}
</style>
</head>
<body>
  <div id="app"></div>

<script>
var DARJAH_LABELS = ['Darjah 1','Darjah 2','Darjah 3','Darjah 4','Darjah 5','Darjah 6'];

var TOPICS = {
  1: [
    {name:'Kata Nama Am & Khas', desc:'Mengenal kata nama am dan khas', icon:'📛', ready:true, href:'latihan-bm.html?topic=d1-kata-nama'},
    {name:'Ayat Tunggal Mudah', desc:'Bina & kenal pasti ayat tunggal', icon:'📝', ready:true, href:'latihan-bm.html?topic=d1-ayat-tunggal'},
    {name:'Imbuhan Awalan', desc:'Imbuhan me- dan ber-', icon:'🔤', ready:true, href:'latihan-bm.html?topic=d1-imbuhan-awalan'},
    {name:'Bacaan & Kefahaman', desc:'Ayat pendek dan pemahaman', icon:'📖', ready:true, href:'latihan-bm.html?topic=d1-kefahaman'},
    {name:'Karangan Gambar Tunggal', desc:'Menulis berdasarkan satu gambar', icon:'🖼️', ready:true, href:'latihan-bm.html?topic=d1-karangan-gambar'},
  ],
  2: [
    {name:'Kata Kerja & Kata Adjektif', desc:'Kenal pasti dan guna dengan betul', icon:'🏃', ready:true, href:'latihan-bm.html?topic=d2-kata-kerja-adjektif'},
    {name:'Ayat Tunggal & Majmuk Asas', desc:'Gabungkan ayat dengan kata hubung', icon:'📝', ready:true, href:'latihan-bm.html?topic=d2-ayat-majmuk-asas'},
    {name:'Imbuhan Akhiran', desc:'Imbuhan -kan dan -i', icon:'🔤', ready:true, href:'latihan-bm.html?topic=d2-imbuhan-akhiran'},
    {name:'Kefahaman Petikan Pendek', desc:'Baca dan jawab soalan', icon:'📖', ready:true, href:'latihan-bm.html?topic=d2-kefahaman-petikan'},
    {name:'Karangan Gambar Tunggal', desc:'Menulis berdasarkan satu gambar', icon:'🖼️', ready:true, href:'latihan-bm.html?topic=d2-karangan-gambar'},
  ],
  3: [
    {name:'Kata Ganti & Kata Sendi Nama', desc:'saya, kami, di, ke, dari', icon:'🔗', ready:true, href:'latihan-bm.html?topic=d3-ganti-sendi-nama'},
    {name:'Imbuhan Apitan Asas', desc:'pe-...-an, ke-...-an', icon:'🔤', ready:true, href:'latihan-bm.html?topic=d3-imbuhan-apitan'},
    {name:'Ayat Majmuk Gabungan', desc:'dan, manakala, atau', icon:'📝', ready:true, href:'latihan-bm.html?topic=d3-ayat-majmuk-gabungan'},
    {name:'Kefahaman Petikan Sederhana', desc:'Petikan lebih panjang', icon:'📖', ready:true, href:'latihan-bm.html?topic=d3-kefahaman-sederhana'},
    {name:'Karangan Gambar Bersiri', desc:'Cerita ikut beberapa gambar', icon:'🖼️', ready:true, href:'latihan-bm.html?topic=d3-karangan-gambar-bersiri'},
  ],
  4: [
    {name:'Kata Hubung & Imbuhan Lanjutan', desc:'kerana, supaya, walaupun', icon:'🔗', ready:true, href:'latihan-bm.html?topic=d4-kata-hubung-imbuhan'},
    {name:'Ayat Majmuk Pancangan', desc:'bahawa, yang', icon:'📝', ready:true, href:'latihan-bm.html?topic=d4-ayat-majmuk-pancangan'},
    {name:'Peribahasa Asas', desc:'Ringan tulang, kaki ayam...', icon:'💬', ready:true, href:'latihan-bm.html?topic=d4-peribahasa-asas'},
    {name:'Kefahaman & Jawapan Berayat', desc:'Jawab dengan ayat lengkap', icon:'📖', ready:true, href:'latihan-bm.html?topic=d4-kefahaman-jawapan-berayat'},
    {name:'Karangan Gambar Tunggal/Bersiri', desc:'Struktur & teknik menulis', icon:'🖼️', ready:true, href:'latihan-bm.html?topic=d4-karangan-gambar'},
    {name:'Surat Kiriman Tidak Rasmi', desc:'Format surat kepada kawan/keluarga', icon:'✉️', ready:true, href:'latihan-bm.html?topic=d4-surat-tidak-rasmi'},
  ],
  5: [
    {name:'Golongan Kata Lanjutan', desc:'Kata nama, kerja, adjektif, dll', icon:'📚', ready:true, href:'latihan-bm.html?topic=d5-golongan-kata-lanjutan'},
    {name:'Ayat Aktif & Pasif', desc:'Tukar ayat aktif ke pasif', icon:'🔄', ready:true, href:'latihan-bm.html?topic=d5-ayat-aktif-pasif'},
    {name:'Peribahasa & Simpulan Bahasa', desc:'Makna kiasan lanjutan', icon:'💬', ready:true, href:'latihan-bm.html?topic=d5-peribahasa-simpulan'},
    {name:'Kefahaman Petikan Panjang', desc:'Petikan isu semasa', icon:'📖', ready:true, href:'latihan-bm.html?topic=d5-kefahaman-panjang'},
    {name:'Karangan Naratif/Deskriptif', desc:'Cerita & penggambaran', icon:'🖋️', ready:true, href:'latihan-bm.html?topic=d5-karangan-naratif-deskriptif'},
    {name:'Surat Kiriman Rasmi', desc:'Format surat rasmi', icon:'📩', ready:true, href:'latihan-bm.html?topic=d5-surat-rasmi'},
    {name:'Rumusan Asas', desc:'Ringkaskan isi petikan', icon:'📋', ready:true, href:'latihan-bm.html?topic=d5-rumusan-asas'},
  ],
  6: [
    {name:'Tatabahasa Pemantapan', desc:'Ulangkaji menyeluruh', icon:'✅', ready:true, href:'latihan-bm.html?topic=d6-tatabahasa-pemantapan'},
    {name:'Peribahasa & Pantun', desc:'Termasuk struktur pantun', icon:'🎭', ready:true, href:'latihan-bm.html?topic=d6-peribahasa-pantun'},
    {name:'Kefahaman Aras Tinggi', desc:'Soalan KBAT', icon:'🧠', ready:true, href:'latihan-bm.html?topic=d6-kefahaman-kbat'},
    {name:'Karangan Berformat', desc:'Surat, laporan, ucapan', icon:'🖋️', ready:true, href:'latihan-bm.html?topic=d6-karangan-berformat'},
    {name:'Rumusan Lengkap', desc:'Isi tersurat & tersirat', icon:'📋', ready:true, href:'latihan-bm.html?topic=d6-rumusan-lengkap'},
    {name:'Ulasan Petikan', desc:'Beri pendapat & penilaian', icon:'🔍', ready:true, href:'latihan-bm.html?topic=d6-ulasan-petikan'},
  ],
};

var state = {screen:'darjah', darjah:null};
var app = document.getElementById('app');

function readyCount(d){
  return TOPICS[d].filter(function(t){return t.ready;}).length;
}

function renderDarjahPicker(){
  var html = '<header>'
    + '<div class="eyebrow">Latihan &middot; Bahasa Melayu</div>'
    + '<h1>Pilih darjah</h1>'
    + '<div class="sub">Setiap darjah ada beberapa topik. Topik yang dah siap boleh main terus.</div>'
    + '</header>'
    + '<div class="darjah-grid">';
  for(var d=1; d<=6; d++){
    var rc = readyCount(d);
    html += '<div class="darjah-card" data-d="'+d+'">'
      + '<div class="darjah-num">'+d+'</div>'
      + '<div class="darjah-name">'+DARJAH_LABELS[d-1]+'</div>'
      + '<div class="darjah-count">'+rc+' / '+TOPICS[d].length+' topik siap</div>'
      + '</div>';
  }
  html += '</div>'
    + '<footer>lebih banyak topik akan ditambah dari semasa ke semasa</footer>';
  app.innerHTML = html;
  document.querySelectorAll('[data-d]').forEach(function(card){
    card.onclick = function(){
      state.darjah = parseInt(card.dataset.d);
      state.screen = 'topics';
      render();
    };
  });
}

function renderTopicList(){
  var d = state.darjah;
  var topics = TOPICS[d];
  var html = '<button class="back-btn" id="backBtn">\u2190 Darjah</button>'
    + '<header>'
    + '<div class="eyebrow">Bahasa Melayu &middot; '+DARJAH_LABELS[d-1]+'</div>'
    + '<h1>Senarai latihan</h1>'
    + '<div class="sub">Pilih topik untuk mula berlatih.</div>'
    + '</header>'
    + '<div class="topic-list">';

  topics.forEach(function(t){
    if(t.ready){
      html += '<a class="topic-card ready" href="'+t.href+'">'
        + '<div class="topic-icon">'+t.icon+'</div>'
        + '<div class="topic-body"><div class="topic-name">'+t.name+'</div><div class="topic-desc">'+t.desc+'</div></div>'
        + '<div class="topic-badge badge-ready">Sedia</div>'
        + '</a>';
    } else {
      html += '<div class="topic-card soon">'
        + '<div class="topic-icon">'+t.icon+'</div>'
        + '<div class="topic-body"><div class="topic-name">'+t.name+'</div><div class="topic-desc">'+t.desc+'</div></div>'
        + '<div class="topic-badge badge-soon">Akan Datang</div>'
        + '</div>';
    }
  });

  html += '</div>'
    + '<footer>topik "Akan Datang" akan diisi bila diperlukan</footer>';
  app.innerHTML = html;
  document.getElementById('backBtn').onclick = function(){
    state.screen = 'darjah';
    render();
  };
}

function render(){
  if(state.screen==='darjah') renderDarjahPicker();
  else renderTopicList();
}
render();
</script>
</body>
</html>
