<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sains — Latihan</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#EEF3F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFDFF;
    --ink:#1E2A4A;
    --ink-soft:#5A6785;
    --grid:#DCE8F7;
    --sains:#8C3B4A;
    --sains-soft:#F6E8EA;
    --ready:#2F7A4F;
    --ready-bg:#EAF7EF;
    --soon-bg:#F1F2F5;
    --soon-ink:#9099AA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:18px 16px 40px;
  }
  .back-btn{
    background:none;border:none;font-family:'Fredoka';font-size:14px;font-weight:600;
    color:var(--ink-soft);padding:6px 0 14px;cursor:pointer;
  }
  header{margin-bottom:18px;}
  .eyebrow{
    font-family:'Fredoka';font-size:12px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:var(--sains);
  }
  h1{
    font-family:'Fredoka';font-weight:700;font-size:clamp(26px,7vw,34px);
    margin:4px 0 4px;color:var(--ink);
  }
  .sub{font-size:14px;color:var(--ink-soft);max-width:48ch;}

  /* ---- Darjah picker grid ---- */
  .darjah-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;
  }
  .darjah-card{
    background:#fff;border:2.5px solid var(--sains);border-radius:14px;
    padding:16px 14px;text-align:center;cursor:pointer;
    box-shadow:0 4px 0 var(--sains);
    transition:transform .1s;
  }
  .darjah-card:active{transform:translateY(2px);box-shadow:0 2px 0 var(--sains);}
  .darjah-num{font-family:'Fredoka';font-weight:700;font-size:28px;color:var(--sains);}
  .darjah-name{font-family:'Fredoka';font-weight:600;font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .darjah-count{font-size:11px;color:var(--ink-soft);margin-top:6px;font-weight:700;}

  /* ---- Topic list (within a darjah) ---- */
  .topic-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .topic-card{
    display:flex;align-items:center;gap:12px;
    background:#fff;border-radius:12px;padding:14px 16px;
    text-decoration:none;color:inherit;
    box-shadow:0 1px 0 rgba(0,0,0,0.04),0 4px 12px rgba(30,42,74,0.06);
  }
  .topic-card.ready{border-left:5px solid var(--ready);}
  .topic-card.soon{border-left:5px solid #D8DCE3;opacity:0.72;}
  .topic-icon{font-size:24px;flex:0 0 auto;width:34px;text-align:center;}
  .topic-body{flex:1;min-width:0;}
  .topic-name{font-family:'Fredoka';font-weight:600;font-size:15px;color:var(--ink);}
  .topic-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
  .topic-badge{
    flex:0 0 auto;font-family:'Fredoka';font-size:10.5px;font-weight:600;
    padding:4px 10px;border-radius:20px;white-space:nowrap;
  }
  .badge-ready{background:var(--ready-bg);color:var(--ready);}
  .badge-soon{background:var(--soon-bg);color:var(--soon-ink);}
  .topic-card.soon .topic-name,.topic-card.soon .topic-desc{color:var(--soon-ink);}

  footer{text-align:center;margin-top:32px;font-size:11px;color:var(--ink-soft);font-family:'Fredoka';}
</style>
</head>
<body>
  <div id="app"></div>

<script>
var DARJAH_LABELS = ['Darjah 1','Darjah 2','Darjah 3','Darjah 4','Darjah 5','Darjah 6'];

var TOPICS = {
  1: [
    {name:'Diri Saya (Deria)', desc:'Kenal 5 deria & organ deria', icon:'\uD83D\uDC41\uFE0F', ready:true, href:'latihan-sains.html?topic=d1-diri-saya'},
    {name:'Hidupan vs Bukan Hidupan', desc:'Kenal pasti benda hidup & tak hidup', icon:'\uD83C\uDF31', ready:true, href:'latihan-sains.html?topic=d1-hidupan'},
    {name:'Haiwan & Tumbuhan', desc:'Klasifikasi asas di sekeliling kita', icon:'\uD83D\uDC31', ready:true, href:'latihan-sains.html?topic=d1-haiwan-tumbuhan'},
    {name:'Keperluan Asas Hidupan', desc:'Air, udara, makanan', icon:'\uD83D\uDCA7', ready:true, href:'latihan-sains.html?topic=d1-keperluan-asas'},
  ],
  2: [
    {name:'Ciri Hidupan', desc:'Bernafas, makan, membesar, membiak', icon:'\u2764\uFE0F', ready:true, href:'latihan-sains.html?topic=d2-ciri-hidupan'},
    {name:'Bahan & Sifatnya', desc:'Pepejal, cecair, gas', icon:'\uD83E\uDDEA', ready:true, href:'latihan-sains.html?topic=d2-bahan'},
    {name:'Cuaca & Langit', desc:'Matahari, bulan, bintang, awan', icon:'\u2600\uFE0F', ready:true, href:'latihan-sains.html?topic=d2-cuaca-langit'},
  ],
  3: [
    {name:'Kepelbagaian Hidupan', desc:'Vertebrata, invertebrata, klasifikasi', icon:'\uD83D\uDC1E', ready:true, href:'latihan-sains.html?topic=d3-kepelbagaian'},
    {name:'Rantai Makanan', desc:'Pengeluar, pengguna, interaksi', icon:'\uD83E\uDD8A', ready:true, href:'latihan-sains.html?topic=d3-rantai-makanan'},
    {name:'Daya & Gerakan', desc:'Tolak, tarik, gerakan objek', icon:'\u26BD', ready:true, href:'latihan-sains.html?topic=d3-daya-gerakan'},
    {name:'Cahaya & Bunyi', desc:'Sifat asas cahaya dan bunyi', icon:'\uD83D\uDD0A', ready:true, href:'latihan-sains.html?topic=d3-cahaya-bunyi'},
  ],
  4: [
    {name:'Sistem Badan Manusia', desc:'Organ deria & anggota badan', icon:'\uD83E\uDDB4', ready:true, href:'latihan-sains.html?topic=d4-sistem-badan'},
    {name:'Pemboleh Ubah', desc:'20 eksperimen \u00d7 4 jenis soalan \u2014 topik yang anak selalu keliru', icon:'\uD83D\uDD2C', ready:true, href:'pemboleh_ubah_latihan.html'},
    {name:'Sifat Bahan', desc:'Pepejal, cecair, gas & perubahan', icon:'\uD83E\uDDCA', ready:true, href:'latihan-sains.html?topic=d4-sifat-bahan'},
    {name:'Tenaga', desc:'Bentuk & sumber tenaga', icon:'\u26A1', ready:true, href:'latihan-sains.html?topic=d4-tenaga'},
  ],
  5: [
    {name:'Sistem Respirasi & Peredaran Darah', desc:'Bernafas & jantung mengepam darah', icon:'\uD83E\uDEC1', ready:true, href:'latihan-sains.html?topic=d5-respirasi-peredaran'},
    {name:'Jirim & Perubahan Keadaan', desc:'Penyejatan, kondensasi, pemejalwapan', icon:'\uD83D\uDCA8', ready:true, href:'latihan-sains.html?topic=d5-jirim'},
    {name:'Litar Elektrik', desc:'Litar ringkas, pengalir & penebat', icon:'\uD83D\uDD0B', ready:true, href:'latihan-sains.html?topic=d5-litar-elektrik'},
    {name:'Bumi & Sumber Asli', desc:'Air, tanah, hutan \u2014 kepentingan menjaga', icon:'\uD83C\uDF0D', ready:true, href:'latihan-sains.html?topic=d5-bumi-sumber'},
  ],
  6: [
    {name:'Sistem Saraf', desc:'Otak, saraf tunjang, tindakan refleks', icon:'\uD83E\uDDE0', ready:true, href:'latihan-sains.html?topic=d6-sistem-saraf'},
    {name:'Bumi & Alam Semesta', desc:'Fasa bulan, planet, gerhana', icon:'\uD83C\uDF15', ready:true, href:'latihan-sains.html?topic=d6-bumi-alam-semesta'},
    {name:'Teknologi Hijau', desc:'3R, gaya hidup lestari', icon:'\u267B\uFE0F', ready:true, href:'latihan-sains.html?topic=d6-teknologi-hijau'},
    {name:'Ulangkaji Bersepadu', desc:'Persediaan menyeluruh sebelum exam', icon:'\uD83D\uDCDA', ready:true, href:'latihan-sains.html?topic=d6-ulangkaji'},
  ],
};

var state = {screen:'darjah', darjah:null};
var app = document.getElementById('app');

function readyCount(d){
  return TOPICS[d].filter(function(t){return t.ready;}).length;
}

function renderDarjahPicker(){
  var html = '<header>'
    + '<div class="eyebrow">Latihan &middot; Sains</div>'
    + '<h1>Pilih darjah</h1>'
    + '<div class="sub">Setiap darjah ada beberapa topik. Topik yang dah siap boleh main terus.</div>'
    + '</header>'
    + '<div class="darjah-grid">';
  for(var d=1; d<=6; d++){
    var rc = readyCount(d);
    html += '<div class="darjah-card" data-d="'+d+'">'
      + '<div class="darjah-num">'+d+'</div>'
      + '<div class="darjah-name">'+DARJAH_LABELS[d-1]+'</div>'
      + '<div class="darjah-count">'+rc+' / '+TOPICS[d].length+' topik siap</div>'
      + '</div>';
  }
  html += '</div>'
    + '<footer>lebih banyak topik akan ditambah dari semasa ke semasa</footer>';
  app.innerHTML = html;
  document.querySelectorAll('[data-d]').forEach(function(card){
    card.onclick = function(){
      state.darjah = parseInt(card.dataset.d);
      state.screen = 'topics';
      render();
    };
  });
}

function renderTopicList(){
  var d = state.darjah;
  var topics = TOPICS[d];
  var html = '<button class="back-btn" id="backBtn">\u2190 Darjah</button>'
    + '<header>'
    + '<div class="eyebrow">Sains &middot; '+DARJAH_LABELS[d-1]+'</div>'
    + '<h1>Senarai latihan</h1>'
    + '<div class="sub">Pilih topik untuk mula berlatih.</div>'
    + '</header>'
    + '<div class="topic-list">';

  topics.forEach(function(t){
    if(t.ready){
      html += '<a class="topic-card ready" href="'+t.href+'">'
        + '<div class="topic-icon">'+t.icon+'</div>'
        + '<div class="topic-body"><div class="topic-name">'+t.name+'</div><div class="topic-desc">'+t.desc+'</div></div>'
        + '<div class="topic-badge badge-ready">Sedia</div>'
        + '</a>';
    } else {
      html += '<div class="topic-card soon">'
        + '<div class="topic-icon">'+t.icon+'</div>'
        + '<div class="topic-body"><div class="topic-name">'+t.name+'</div><div class="topic-desc">'+t.desc+'</div></div>'
        + '<div class="topic-badge badge-soon">Akan Datang</div>'
        + '</div>';
    }
  });

  html += '</div>'
    + '<footer>topik "Akan Datang" akan diisi bila diperlukan</footer>';
  app.innerHTML = html;
  document.getElementById('backBtn').onclick = function(){
    state.screen = 'darjah';
    render();
  };
}

function render(){
  if(state.screen==='darjah') renderDarjahPicker();
  else renderTopicList();
}
render();
</script>
</body>
</html>
