<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Sains — Buku Latihan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Sriracha&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --paper:#f2ece0;
    --paper-line:#d0c3a5;
    --ink:#2a2620;
    --plum:#5c3d5c;
    --plum-mid:#8a6a8a;
    --plum-light:#d3c0d3;
    --teal:#3a7d6e;
    --teal-dark:#2a5c50;
    --amber:#d9932b;
    --card:#fffdf7;
    --shadow:rgba(42,38,32,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 34px, var(--paper-line) 35px),
      var(--paper);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex; justify-content:center;
    padding:26px 14px 60px;
  }
  .book{ width:100%; max-width:660px; }

  .back-link{
    display:inline-block; margin-bottom:12px; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:13px; color:var(--plum); text-decoration:none;
  }

  .cover{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:6px;
    box-shadow:6px 6px 0 var(--shadow);
    padding:22px 24px 18px;
    position:relative;
    margin-bottom:18px;
  }
  .cover::before{
    content:"";
    position:absolute; left:16px; top:0; bottom:0; width:2px;
    background:repeating-linear-gradient(0deg,var(--amber) 0 8px, transparent 8px 16px);
    opacity:0.5;
  }
  .stamp{
    position:absolute; top:14px; right:18px;
    width:66px; height:66px;
    border:3px solid var(--plum);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transform:rotate(-12deg);
    color:var(--plum);
    font-family:'Sriracha',cursive;
    font-size:11.5px; text-align:center; line-height:1.15;
    opacity:0.85;
  }
  .eyebrow{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    letter-spacing:0.14em; text-transform:uppercase;
    font-size:11px; color:var(--teal-dark);
    margin-left:22px;
  }
  h1{
    font-family:'Sriracha',cursive; font-weight:400;
    font-size:26px; margin:4px 0 2px 22px; color:var(--plum);
  }
  .sub{ margin:0 0 4px 22px; font-size:13.5px; color:#5a5346; }

  .startBtn{
    margin-top:16px; width:100%; padding:14px;
    background:var(--plum); color:#fff; border:none; border-radius:7px;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;
    cursor:pointer; box-shadow:3px 3px 0 var(--shadow);
  }
  .startBtn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow); }

  /* ===== quiz area ===== */
  .hud{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin:0 0 14px;
  }
  .hud-box{
    background:var(--card); border:2px solid var(--ink); border-radius:6px;
    box-shadow:3px 3px 0 var(--shadow); padding:8px 14px;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
    display:flex; align-items:center; gap:8px;
  }
  .hud-box .val{ font-size:18px; }
  #timerBox{
    position:relative; overflow:hidden;
    min-width:88px; justify-content:center;
  }
  #timerBar{
    position:absolute; left:0; bottom:0; top:0; width:100%;
    background:var(--plum-light); z-index:0;
    transition:width 1s linear, background 0.3s ease;
  }
  #timerBox span{ position:relative; z-index:1; }
  #timerBox.low #timerBar{ background:#e79a8a; }
  .soundToggle{
    background:var(--card); border:2px solid var(--ink); border-radius:50%;
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:3px 3px 0 var(--shadow); font-size:16px; user-select:none;
  }
  .soundToggle:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow); }

  .progressWrap{
    height:8px; background:#e6ddc4; border-radius:20px; overflow:hidden;
    margin-bottom:16px; border:1.5px solid var(--ink);
  }
  .progressBar{
    height:100%; background:linear-gradient(90deg, var(--plum-mid), var(--plum));
    width:0%; transition:width 0.4s ease;
  }

  .card{
    background:var(--card); border:2px solid var(--ink); border-radius:8px;
    box-shadow:6px 6px 0 var(--shadow); padding:22px 22px 20px; position:relative;
  }
  .expTag{
    display:inline-block;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11.5px;
    letter-spacing:0.05em; background:var(--teal-dark); color:#fff;
    padding:3px 10px; border-radius:20px; margin-bottom:10px;
  }
  .qnum{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px;
    color:var(--plum); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em;
  }
  .qtext{
    font-size:17px; line-height:1.5; font-weight:600; margin:0 0 16px; color:var(--ink);
  }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    text-align:left; background:#fff; border:2px solid #ddd3ba; border-radius:7px;
    padding:12px 14px; font-size:15px; font-family:'Inter',sans-serif; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    transition:background 0.15s, border-color 0.15s, transform 0.08s;
  }
  .opt:hover{ border-color:var(--plum-mid); background:#faf6ec; }
  .opt:active{ transform:scale(0.99); }
  .opt .letter{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%;
    border:2px solid var(--ink); display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px;
  }
  .opt.correct{ background:#e0efe9; border-color:var(--teal-dark); }
  .opt.correct .letter{ background:var(--teal-dark); color:#fff; }
  .opt.wrong{ background:#f4e2ea; border-color:var(--plum); }
  .opt.wrong .letter{ background:var(--plum); color:#fff; }
  .opt.disabled{ pointer-events:none; opacity:0.75; }
  .opt.disabled.correct, .opt.disabled.wrong{ opacity:1; }

  .feedback{
    margin-top:14px; padding:12px 14px; border-radius:7px;
    font-size:14px; line-height:1.55; display:none;
  }
  .feedback.show{ display:block; }
  .feedback.good{ background:#e0efe9; border:1.5px dashed var(--teal-dark); color:var(--teal-dark); }
  .feedback.bad{ background:#f4e2ea; border:1.5px dashed var(--plum); color:var(--plum); }
  .feedback b{ display:block; margin-bottom:3px; font-family:'Space Grotesk',sans-serif; }

  .nextBtn{
    margin-top:16px; width:100%; padding:13px;
    background:var(--plum); color:#fff; border:none; border-radius:7px;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;
    letter-spacing:0.03em; cursor:pointer; display:none; box-shadow:3px 3px 0 var(--shadow);
  }
  .nextBtn.show{ display:block; }
  .nextBtn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow); }

  .result{ text-align:center; padding:10px 6px; }
  .result .emoji{ font-size:52px; }
  .result h2{
    font-family:'Sriracha',cursive; font-weight:400; color:var(--plum);
    font-size:26px; margin:6px 0 2px;
  }
  .result .scoreLine{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; margin:8px 0 4px; }
  .result p{ color:#5a5346; font-size:14px; margin:6px 0 18px; }
  .restartBtn, .homeBtn{
    padding:13px 22px; background:var(--amber); color:#fff; border:none; border-radius:7px;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;
    cursor:pointer; box-shadow:3px 3px 0 var(--shadow); margin:4px;
  }
  .homeBtn{ background:var(--plum); }
  .restartBtn:active, .homeBtn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow); }

  .breakdown{ text-align:left; margin-top:18px; border-top:1.5px dashed var(--paper-line); padding-top:14px; }
  .breakdown-item{
    display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:6px 0;
    border-bottom:1px dotted #e6ddc4;
  }
  .breakdown-item .mark{ flex:0 0 auto; font-size:16px; }
  .breakdown-item{ flex-direction:column; }
  .breakdown-item .row{ display:flex; gap:8px; align-items:flex-start; width:100%; }
  .breakdown-item .answer-detail{
    margin:6px 0 2px 24px; font-size:12.5px; line-height:1.5;
    background:#FBEAEA; border-left:3px solid #D9534F; border-radius:4px;
    padding:6px 10px;
  }
  .breakdown-item .answer-detail .yourans{ color:#B93A2E; }
  .breakdown-item .answer-detail .rightans{ color:#2F7A4F; font-weight:600; }

  footer{ text-align:center; font-size:11.5px; color:#8a8371; margin-top:20px; }

  @media (max-width:420px){
    h1{ font-size:20px; }
    .qtext{ font-size:16px; }
  }
</style>
</head>
<body>
<div class="book">

  <a class="back-link" href="sains-latihan-hub.html">← Kembali ke senarai topik</a>

  <div class="cover">
    <div class="stamp" id="coverStamp">SAINS</div>
    <div class="eyebrow" id="coverEyebrow">Buku Latihan</div>
    <h1 id="coverTitle">Latihan Sains</h1>
    <p class="sub" id="coverSub">Sedia menanti...</p>
  </div>

  <div class="cover" id="startCard">
    <button class="startBtn" id="startBtn">Mula Latihan →</button>
  </div>

  <!-- ===== QUIZ ===== -->
  <div id="quizArea" style="display:none;">
    <div class="hud">
      <div class="hud-box">⭐ <span class="val" id="scoreVal">0</span></div>
      <div class="hud-box" id="timerBox"><div id="timerBar"></div><span>⏱ <span id="timeVal">30</span>s</span></div>
      <div class="hud-box">📋 <span class="val" id="qCounter">1/12</span></div>
      <div class="soundToggle" id="soundToggle" title="Bunyi hidup/mati">🔊</div>
    </div>

    <div class="progressWrap"><div class="progressBar" id="progressBar"></div></div>

    <div class="card" id="quizCard">
      <span class="expTag" id="expTag">Soalan</span>
      <div class="qnum" id="qNum">&nbsp;</div>
      <p class="qtext" id="qText">...</p>
      <div class="options" id="optionsWrap"></div>
      <div class="feedback" id="feedback"></div>
      <button class="nextBtn" id="nextBtn">Seterusnya →</button>
    </div>
  </div>

  <div class="card result" id="resultArea" style="display:none;">
    <div class="emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Syabas!</h2>
    <div class="scoreLine" id="resultScore">0 / 12</div>
    <p id="resultMsg">Cuba lagi untuk skor lebih tinggi!</p>
    <button class="restartBtn" id="restartBtn">Ulang Latihan</button>
    <button class="homeBtn" id="homeBtn">🏠 Senarai Topik</button>
    <div class="breakdown" id="breakdown"></div>
  </div>

  <footer id="footerText">Latihan Sains · Study Buddy</footer>
</div>

/* ===================== SOUND ENGINE ===================== */
let soundOn = true;
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function ensureCtx(){ if(!actx) actx = new AudioCtx(); return actx; }
function beep({freq=440, dur=0.15, type='sine', gain=0.2, delay=0}){
  if(!soundOn) return;
  const ctx = ensureCtx();
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function sfxCorrect(){
  beep({freq:523.25, dur:0.12, type:'triangle', gain:0.22});
  beep({freq:659.25, dur:0.12, type:'triangle', gain:0.22, delay:0.1});
  beep({freq:783.99, dur:0.18, type:'triangle', gain:0.24, delay:0.2});
}
function sfxWrong(){
  beep({freq:220, dur:0.18, type:'sawtooth', gain:0.18});
  beep({freq:164.81, dur:0.25, type:'sawtooth', gain:0.18, delay:0.14});
}
function sfxClick(){ beep({freq:600, dur:0.05, type:'square', gain:0.08}); }
function sfxTick(){ beep({freq:880, dur:0.045, type:'square', gain:0.06}); }
function sfxTimeUp(){
  beep({freq:180, dur:0.3, type:'sawtooth', gain:0.2});
  beep({freq:140, dur:0.4, type:'sawtooth', gain:0.2, delay:0.2});
}
function sfxFanfare(){
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>beep({freq:f,dur:0.22,type:'triangle',gain:0.22,delay:i*0.13}));
}

/* ===================== LOAD TOPIC ===================== */
const params = new URLSearchParams(window.location.search);
const topicId = params.get('topic') || Object.keys(TOPIC_BANKS)[0];
const meta = TOPIC_META[topicId] || {title:'Latihan Sains', darjah:'', emoji:'🔬'};
let QUESTIONS = (TOPIC_BANKS[topicId] || []).slice();

document.getElementById('coverTitle').textContent = meta.emoji + ' ' + meta.title;
document.getElementById('coverEyebrow').textContent = 'Buku Latihan · ' + meta.darjah;
document.getElementById('coverSub').textContent = QUESTIONS.length + ' soalan · 30 saat/soalan';
document.getElementById('coverStamp').innerHTML = meta.darjah.replace('Darjah ','D') + '<br>SAINS';
document.getElementById('footerText').textContent = meta.title + ' · Sains · Study Buddy';
document.title = meta.title + ' — Latihan Sains';

const LETTERS = ['A','B','C','D'];

/* ===================== STATE ===================== */
let currentIndex = 0;
let score = 0;
let selectedAnswers = [];
let answered = false;
let timer = null;
let timeLeft = 30;
const TIME_LIMIT = 30;

const startCard = document.getElementById('startCard');
const startBtn = document.getElementById('startBtn');
const quizArea = document.getElementById('quizArea');
const resultArea = document.getElementById('resultArea');

const expTag = document.getElementById('expTag');
const qNum = document.getElementById('qNum');
const qText = document.getElementById('qText');
const optionsWrap = document.getElementById('optionsWrap');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const scoreVal = document.getElementById('scoreVal');
const qCounter = document.getElementById('qCounter');
const progressBar = document.getElementById('progressBar');
const soundToggle = document.getElementById('soundToggle');
const timerBox = document.getElementById('timerBox');
const timerBar = document.getElementById('timerBar');
const timeVal = document.getElementById('timeVal');

soundToggle.addEventListener('click', ()=>{
  soundOn = !soundOn;
  soundToggle.textContent = soundOn ? '🔊' : '🔇';
  if(soundOn){ ensureCtx(); sfxClick(); }
});

startBtn.addEventListener('click', ()=>{
  ensureCtx();
  sfxClick();
  startCard.style.display = 'none';
  quizArea.style.display = 'block';
  QUESTIONS = shuffle(QUESTIONS);
  currentIndex = 0; score = 0; selectedAnswers = [];
  scoreVal.textContent = 0;
  loadQuestion();
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startTimer(){
  clearInterval(timer);
  timeLeft = TIME_LIMIT;
  timerBox.classList.remove('low');
  updateTimerUI();
  timer = setInterval(()=>{
    timeLeft--;
    updateTimerUI();
    if(timeLeft <= 5 && timeLeft > 0){ sfxTick(); }
    if(timeLeft <= 0){
      clearInterval(timer);
      sfxTimeUp();
      handleTimeout();
    }
  },1000);
}

function updateTimerUI(){
  timeVal.textContent = timeLeft;
  const pct = Math.max(0,(timeLeft/TIME_LIMIT)*100);
  timerBar.style.width = pct + '%';
  timerBox.classList.toggle('low', timeLeft <= 5);
}

function loadQuestion(){
  answered = false;
  feedback.classList.remove('show','good','bad');
  nextBtn.classList.remove('show');
  const q = QUESTIONS[currentIndex];

  expTag.textContent = meta.title;
  qNum.textContent = 'Soalan ' + (currentIndex+1);
  qText.textContent = q.q;
  qCounter.textContent = `${currentIndex+1}/${QUESTIONS.length}`;
  progressBar.style.width = ((currentIndex)/QUESTIONS.length*100) + '%';

  optionsWrap.innerHTML = '';
  const order = shuffle(q.options);
  q._order = order;

  order.forEach((optText, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="letter">${LETTERS[idx] || (idx+1)}</span><span>${optText}</span>`;
    btn.addEventListener('click', ()=> selectAnswer(btn, optText));
    optionsWrap.appendChild(btn);
  });

  startTimer();
}

function selectAnswer(btn, chosenText){
  if(answered) return;
  answered = true;
  clearInterval(timer);
  const q = QUESTIONS[currentIndex];
  const isCorrect = chosenText === q.correct;

  document.querySelectorAll('.opt').forEach(el=>el.classList.add('disabled'));
  document.querySelectorAll('.opt').forEach((el)=>{
    const txt = el.querySelector('span:last-child').textContent;
    if(txt === q.correct){ el.classList.add('correct'); }
    else if(el === btn){ el.classList.add('wrong'); }
  });

  if(isCorrect){
    score++;
    scoreVal.textContent = score;
    sfxCorrect();
    feedback.classList.add('show','good');
    feedback.innerHTML = `<b>Betul! 🎉</b>Jawapan yang betul: <b style="display:inline">${q.correct}</b>.`;
  } else {
    sfxWrong();
    feedback.classList.add('show','bad');
    feedback.innerHTML = `<b>Bukan tu.</b>Jawapan yang betul: <b style="display:inline">${q.correct}</b>.`;
  }

  selectedAnswers.push({ q, correct: isCorrect, chosen: chosenText });
  nextBtn.classList.add('show');
  nextBtn.textContent = (currentIndex+1 >= QUESTIONS.length) ? 'Lihat Keputusan →' : 'Seterusnya →';
  nextBtn.focus();
}

function handleTimeout(){
  if(answered) return;
  answered = true;
  const q = QUESTIONS[currentIndex];
  document.querySelectorAll('.opt').forEach(el=>el.classList.add('disabled'));
  document.querySelectorAll('.opt').forEach((el)=>{
    const txt = el.querySelector('span:last-child').textContent;
    if(txt === q.correct){ el.classList.add('correct'); }
  });
  feedback.classList.add('show','bad');
  feedback.innerHTML = `<b>Masa tamat! ⏰</b>Jawapan yang betul: <b style="display:inline">${q.correct}</b>.`;
  selectedAnswers.push({ q, correct:false, chosen: null });
  nextBtn.classList.add('show');
  nextBtn.textContent = (currentIndex+1 >= QUESTIONS.length) ? 'Lihat Keputusan →' : 'Seterusnya →';
}

nextBtn.addEventListener('click', ()=>{
  sfxClick();
  currentIndex++;
  if(currentIndex >= QUESTIONS.length){
    showResult();
  } else {
    loadQuestion();
  }
});

function showResult(){
  clearInterval(timer);
  progressBar.style.width = '100%';
  quizArea.style.display = 'none';
  resultArea.style.display = 'block';

  const pct = Math.round((score/QUESTIONS.length)*100);
  const resultEmoji = document.getElementById('resultEmoji');
  const resultTitle = document.getElementById('resultTitle');
  const resultMsg = document.getElementById('resultMsg');
  document.getElementById('resultScore').textContent = score + ' / ' + QUESTIONS.length;

  if(pct >= 80){
    resultEmoji.textContent = '🏆';
    resultTitle.textContent = 'Syabas, Faham Betul!';
    resultMsg.textContent = 'Konsep ' + meta.title + ' kamu dah mantap!';
    sfxFanfare();
  } else if(pct >= 50){
    resultEmoji.textContent = '👍';
    resultTitle.textContent = 'Dah Faham Sikit!';
    resultMsg.textContent = 'Baca balik jawapan yang salah tadi, lepas tu try lagi sekali.';
  } else {
    resultEmoji.textContent = '💪';
    resultTitle.textContent = 'Jangan Give Up!';
    resultMsg.textContent = 'Baca balik penjelasan yang salah tadi, lepas tu try lagi sekali.';
  }

  const breakdown = document.getElementById('breakdown');
  breakdown.innerHTML = '<div style="font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:13px;margin-bottom:8px;color:#5a5346;">RINGKASAN JAWAPAN</div>';
  selectedAnswers.forEach((a,i)=>{
    const div = document.createElement('div');
    div.className = 'breakdown-item';
    const mark = a.correct ? '✅' : '❌';
    let html = `<div class="row"><span class="mark">${mark}</span><span>${i+1}. ${a.q.q}</span></div>`;
    if(!a.correct){
      const yourAnsText = a.chosen ? a.chosen : 'Tiada jawapan (masa tamat)';
      html += `<div class="answer-detail">
        <div><span class="yourans">Jawapan kamu:</span> ${yourAnsText}</div>
        <div><span class="rightans">Jawapan betul:</span> ${a.q.correct}</div>
      </div>`;
    }
    div.innerHTML = html;
    breakdown.appendChild(div);
  });
}

document.getElementById('restartBtn').addEventListener('click', ()=>{
  sfxClick();
  resultArea.style.display = 'none';
  startCard.style.display = 'block';
});
document.getElementById('homeBtn').addEventListener('click', ()=>{
  window.location.href = 'sains-latihan-hub.html';
});
</script>
